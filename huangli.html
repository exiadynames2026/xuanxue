<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄历 · 择日宜忌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>历</text></svg>">
<link rel="stylesheet" href="common.css">
<script src="lunar.js"></script>
<script src="nav.js"></script>
<style>
.hl-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hl-head .d{font-size:26px;color:var(--accent);font-weight:600}
.hl-head .s{font-size:13px;color:var(--muted)}
.hl-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.hl-grid{grid-template-columns:1fr}}
.hl-box{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px}
.hl-box .k{font-size:11.5px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.hl-box .v{font-size:13px;line-height:1.9}
.hl-yi{color:#9ec9a8}.hl-ji{color:#e0a08d}
.dir{display:inline-block;margin:2px 6px 2px 0;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>黄历择日<small>每日宜忌 · 吉神凶煞</small></h1>
    <a class="gh" href="https://github.com/exiadynames2026/xuanxue" target="_blank">GitHub</a>
  </div>
  <nav></nav>
</header>
<div class="wrap full">
  <div class="card">
    <div class="field" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
      <div style="flex:1;min-width:200px"><label>公历日期</label>
        <div class="row">
          <input type="number" id="inY" value="2026" min="1900" max="2100">
          <input type="number" id="inM" value="11" min="1" max="12">
          <input type="number" id="inD" value="2" min="1" max="31">
        </div>
      </div>
      <button class="btn" style="width:auto;padding:9px 26px;margin:0" id="btnGo">查 询</button>
      <button class="btn ghost" style="width:auto;margin:0" id="btnToday">今天</button>
      <button class="btn ghost" style="width:auto;margin:0" id="btnPrev">← 前一天</button>
      <button class="btn ghost" style="width:auto;margin:0" id="btnNext">后一天 →</button>
    </div>
    <div id="result"><div class="empty">查询任意日期</div></div>
  </div>
</div>
<footer></footer>
<script>
"use strict";
XXNav.render("黄历择日"); XXNav.footer();
const $=s=>document.querySelector(s);
const WEEK=["日","一","二","三","四","五","六"];
function go(y,m,d){
  $("#inY").value=y; $("#inM").value=m; $("#inD").value=d;
  try{
    const solar=Solar.fromYmd(y,m,d), lunar=solar.getLunar();
    const chong=lunar.getDayChongDesc();
    $("#result").innerHTML=`
      <div class="hl-head">
        <span class="d">${y}年${m}月${d}日</span>
        <span class="s">星期${WEEK[(new Date(y,m-1,d)).getDay()]} · ${lunar.toString()} · ${lunar.getYearInGanZhi()}年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhi()}日 · ${lunar.getJieQi()?"当日节气："+lunar.getJieQi():lunar.getNextJie().getName()+"将近"}</span>
      </div>
      <div class="hl-badges">
        <span class="pill gold">建除十二神：${lunar.getZhiXing()}</span>
        <span class="pill ${lunar.getDayTianShenLuck()==="吉"?"green":"red"}">${lunar.getDayTianShen()}（${lunar.getDayTianShenType()}·${lunar.getDayTianShenLuck()}）</span>
        <span class="pill">冲${lunar.getDayChongShengXiao()}（${chong}）</span>
        <span class="pill red">煞${lunar.getSha()}</span>
        <span class="pill">月相：${lunar.getYueXiang()}</span>
        <span class="pill">六耀：${lunar.getLiuYao()}</span>
        <span class="pill">胎神：${lunar.getDayPositionTai()}</span>
        <span class="pill">日禄：${lunar.getDayLu()}</span>
      </div>
      <div class="hl-grid">
        <div class="hl-box"><div class="k">✔ 宜</div><div class="v hl-yi">${lunar.getDayYi().join(" · ")}</div></div>
        <div class="hl-box"><div class="k">✘ 忌</div><div class="v hl-ji">${lunar.getDayJi().join(" · ")}</div></div>
        <div class="hl-box"><div class="k">吉神宜趋</div><div class="v">${lunar.getDayJiShen().join(" · ")}</div></div>
        <div class="hl-box"><div class="k">凶神宜忌</div><div class="v">${lunar.getDayXiongSha().join(" · ")}</div></div>
        <div class="hl-box"><div class="k">吉神方位</div><div class="v">
          <span class="dir">喜神：<b>${lunar.getDayPositionXiDesc()}</b></span>
          <span class="dir">财神：<b>${lunar.getDayPositionCaiDesc()}</b></span>
          <span class="dir">福神：<b>${lunar.getDayPositionFuDesc()}</b></span>
          <span class="dir">阳贵：<b>${lunar.getDayPositionYangGuiDesc()}</b></span>
          <span class="dir">阴贵：<b>${lunar.getDayPositionYinGuiDesc()}</b></span>
        </div></div>
        <div class="hl-box"><div class="k">彭祖百忌</div><div class="v">${lunar.getPengZuGan().replace(/(.)/g,"$1 ")} · ${lunar.getPengZuZhi().replace(/(.)/g,"$1 ")}</div></div>
      </div>
      <div style="margin-top:14px"><div class="k" style="font-size:11.5px;color:var(--muted);letter-spacing:1px;margin-bottom:8px">每日十二时辰吉凶</div>
      <table style="font-size:12.5px"><tr><th>时段</th><th>时辰</th><th>干支</th><th>天神</th><th>吉凶</th><th>冲</th><th>煞方</th><th>旬空</th></tr>
      ${lunar.getTimes().map(t=>`<tr><td>${t.getMinHm()}–${t.getMaxHm()}</td><td><b>${t.getGanZhi()[1]==="子"&&(t.getMinHm()==="23:00")?"晚":(t.getGanZhi()[1]==="子"?"早":"")}${t.getGanZhi()[1]}时</b></td><td>${t.getGanZhi()}</td><td>${t.getTianShen()}</td><td style="color:${t.getTianShenLuck()==="吉"?"var(--ok)":"var(--red)"}"><b>${t.getTianShenLuck()}</b></td><td>冲${t.getChongShengXiao()}</td><td>煞${t.getSha()}</td><td>${t.getXunKong()}</td></tr>`).join("")}
      </table></div>`;
  }catch(e){ $("#result").innerHTML=`<div class="err" style="display:block">${e.message}</div>`; }
}
$("#btnGo").addEventListener("click",()=>go(+$("#inY").value,+$("#inM").value,+$("#inD").value));
$("#btnToday").addEventListener("click",()=>{ const t=new Date(); go(t.getFullYear(),t.getMonth()+1,t.getDate()); });
$("#btnPrev").addEventListener("click",()=>{ const t=new Date(+$("#inY").value,+$("#inM").value-1,+$("#inD").value-1); go(t.getFullYear(),t.getMonth()+1,t.getDate()); });
$("#btnNext").addEventListener("click",()=>{ const t=new Date(+$("#inY").value,+$("#inM").value-1,+$("#inD").value+1); go(t.getFullYear(),t.getMonth()+1,t.getDate()); });
window.addEventListener("load",()=>{ const t=new Date(); go(t.getFullYear(),t.getMonth()+1,t.getDate()); });
</script>
</body>
</html>
